name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Project OLD STYLE
        run: |
          cat > settings.gradle << 'END'
          include ':app'
          END
          
          cat > build.gradle << 'END'
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          task clean(type: Delete) { delete rootProject.buildDir }
          END
          
          cat > gradle.properties << 'END'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          END
          
          mkdir -p app/src/main/java/com/freeconfig/vpn
          mkdir -p app/src/main
          
          cat > app/build.gradle << 'END'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            compileSdkVersion 34
            defaultConfig {
              applicationId "com.freeconfig.vpn"
              minSdkVersion 24
              targetSdkVersion 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes {
              release { minifyEnabled false }
            }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          END
          
          cat > app/src/main/AndroidManifest.xml << 'END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="FreeConfig VPN" android:theme="@android:style/Theme.Light">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          END
          
          cat > app/src/main/java/com/freeconfig/vpn/MainActivity.kt << 'END'
          package com.freeconfig.vpn
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val tv = TextView(this)
              tv.text = "FreeConfig VPN\n3 ساختار: V2Ray, SS, Trojan"
              tv.textSize = 20f
              tv.setPadding(40,200,40,40)
              setContentView(tv)
            }
          }
          END

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeConfigVPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
